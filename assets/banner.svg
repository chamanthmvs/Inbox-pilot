<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Inbox Pilot — organize your Gmail, your way">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5b"/>
      <stop offset="0.45" stop-color="#ff6a88"/>
      <stop offset="1" stop-color="#7b5bff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <style>
      .t  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .h1 { font-size: 66px; font-weight: 800; fill: #ffffff; letter-spacing: -1.5px; }
      .sub{ font-size: 25px; font-weight: 500; fill: #fff; opacity: .95; }
      .pill{ font-size: 17px; font-weight: 600; fill: #fff; }
      .by { font-size: 16px; font-weight: 500; fill: #fff; opacity: .9; }
    </style>
  </defs>

  <rect width="1280" height="340" rx="22" fill="url(#warm)"/>
  <!-- soft decorative circles -->
  <circle cx="1120" cy="70" r="150" fill="#ffffff" opacity="0.08"/>
  <circle cx="1210" cy="300" r="110" fill="#ffffff" opacity="0.06"/>

  <!-- envelope + check glyph -->
  <g transform="translate(70,104)" filter="url(#soft)">
    <rect x="0" y="0" width="150" height="110" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M10 14 L75 64 L140 14" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="92" r="30" fill="#ffffff"/>
    <path d="M106 92 l10 10 l20 -22" fill="none" stroke="#ff6a88" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="270" y="150" class="t h1">Inbox Pilot</text>
  <text x="272" y="196" class="t sub">Organize your Gmail your way — you approve, it flies.</text>

  <!-- feature pills -->
  <g class="t" transform="translate(272,232)">
    <g>
      <rect x="0" y="0" width="196" height="38" rx="19" fill="#ffffff" opacity="0.18"/>
      <text x="20" y="25" class="pill">Human-in-the-loop</text>
    </g>
    <g transform="translate(212,0)">
      <rect x="0" y="0" width="168" height="38" rx="19" fill="#ffffff" opacity="0.18"/>
      <text x="20" y="25" class="pill">Metadata-only</text>
    </g>
    <g transform="translate(396,0)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="#ffffff" opacity="0.18"/>
      <text x="20" y="25" class="pill">Never deletes</text>
    </g>
    <g transform="translate(560,0)">
      <rect x="0" y="0" width="168" height="38" rx="19" fill="#ffffff" opacity="0.18"/>
      <text x="20" y="25" class="pill">Rules + cheap LLM</text>
    </g>
  </g>

  <text x="272" y="305" class="t by">Built by Chamanth MVS</text>
</svg>
